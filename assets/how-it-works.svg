<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 500" width="956" height="500" role="img" aria-labelledby="t d">
<title id="t">How Linkrouter routes a link</title><desc id="d">A link clicked in a terminal under ~/work opens in Chrome's Work profile, under ~/work/clients/acme in the Acme profile, anywhere else in Safari.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1f3a"/><stop offset="1" stop-color="#0d1020"/></linearGradient></defs>
<rect width="956" height="500" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="954" height="498" rx="23" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="2"/>
<text x="36" y="46" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#f3f4fb">Where you clicked decides where it opens</text>
<text x="36" y="72" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#9aa3c2">Linkrouter reads the folder of the focused window, then picks the most specific rule. It has no window of its own.</text>
<text x="36" y="108" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7396" letter-spacing="1.5">CLICK A LINK IN</text>
<text x="376" y="108" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7396" letter-spacing="1.5">MOST SPECIFIC FOLDER WINS</text>
<text x="684" y="108" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7396" letter-spacing="1.5">OPENS IN</text><rect x="36" y="120" width="268" height="88" rx="12" fill="#0a0c14" stroke="#2f3550" stroke-width="2"/><path d="M36 132 Q36 120 48 120 H292 Q304 120 304 132 V146 H36Z" fill="#232a42"/><circle cx="54" cy="133" r="4.5" fill="#ff6b5e"/><circle cx="70" cy="133" r="4.5" fill="#ffc542"/><circle cx="86" cy="133" r="4.5" fill="#4ade80"/><text x="292" y="137" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9aa3c2">~/work/api</text><text x="52" y="172" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6b7396">$ gh pr create</text><text x="52" y="194" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7dd3fc" text-decoration="underline">https://github.com/...</text><text x="272" y="194" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e5e7eb">&#8984;</text><path d="M312 164 H356" stroke="#6b7396" stroke-width="3" fill="none"/><path d="M356 157 L368 164 L356 171Z" fill="#6b7396"/><rect x="376" y="128" width="236" height="72" rx="12" fill="#1c2140" stroke="#4ade80" stroke-opacity="0.8" stroke-width="2"/><text x="394" y="156" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa3c2">rule that wins</text><text x="394" y="182" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="#f3f4fb">~/work</text><path d="M620 164 H664" stroke="#6b7396" stroke-width="3" fill="none"/><path d="M664 157 L676 164 L664 171Z" fill="#6b7396"/><rect x="684" y="128" width="236" height="72" rx="12" fill="#0a0c14" stroke="#4ade80" stroke-width="3"/><circle cx="720" cy="164" r="17" fill="#4ade80"/><circle cx="720" cy="164" r="9" fill="#0a0c14"/><circle cx="720" cy="164" r="4" fill="#4ade80"/><text x="750" y="158" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#f3f4fb">Google Chrome</text><text x="750" y="180" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#4ade80">Work</text><rect x="36" y="236" width="268" height="88" rx="12" fill="#0a0c14" stroke="#2f3550" stroke-width="2"/><path d="M36 248 Q36 236 48 236 H292 Q304 236 304 248 V262 H36Z" fill="#232a42"/><circle cx="54" cy="249" r="4.5" fill="#ff6b5e"/><circle cx="70" cy="249" r="4.5" fill="#ffc542"/><circle cx="86" cy="249" r="4.5" fill="#4ade80"/><text x="292" y="253" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9aa3c2">~/work/clients/acme/site</text><text x="52" y="288" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6b7396">$ gh pr create</text><text x="52" y="310" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7dd3fc" text-decoration="underline">https://github.com/...</text><text x="272" y="310" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e5e7eb">&#8984;</text><path d="M312 280 H356" stroke="#6b7396" stroke-width="3" fill="none"/><path d="M356 273 L368 280 L356 287Z" fill="#6b7396"/><rect x="376" y="244" width="236" height="72" rx="12" fill="#1c2140" stroke="#f472b6" stroke-opacity="0.8" stroke-width="2"/><text x="394" y="272" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa3c2">rule that wins</text><text x="394" y="298" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="#f3f4fb">~/work/clients/acme</text><path d="M620 280 H664" stroke="#6b7396" stroke-width="3" fill="none"/><path d="M664 273 L676 280 L664 287Z" fill="#6b7396"/><rect x="684" y="244" width="236" height="72" rx="12" fill="#0a0c14" stroke="#f472b6" stroke-width="3"/><circle cx="720" cy="280" r="17" fill="#f472b6"/><circle cx="720" cy="280" r="9" fill="#0a0c14"/><circle cx="720" cy="280" r="4" fill="#f472b6"/><text x="750" y="274" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#f3f4fb">Google Chrome</text><text x="750" y="296" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#f472b6">Acme</text><rect x="36" y="352" width="268" height="88" rx="12" fill="#0a0c14" stroke="#2f3550" stroke-width="2"/><path d="M36 364 Q36 352 48 352 H292 Q304 352 304 364 V378 H36Z" fill="#232a42"/><circle cx="54" cy="365" r="4.5" fill="#ff6b5e"/><circle cx="70" cy="365" r="4.5" fill="#ffc542"/><circle cx="86" cy="365" r="4.5" fill="#4ade80"/><text x="292" y="369" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9aa3c2">~/notes</text><text x="52" y="404" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6b7396">$ gh pr create</text><text x="52" y="426" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7dd3fc" text-decoration="underline">https://github.com/...</text><text x="272" y="426" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e5e7eb">&#8984;</text><path d="M312 396 H356" stroke="#6b7396" stroke-width="3" fill="none"/><path d="M356 389 L368 396 L356 403Z" fill="#6b7396"/><rect x="376" y="360" width="236" height="72" rx="12" fill="#1c2140" stroke="#e5e7eb" stroke-opacity="0.8" stroke-width="2"/><text x="394" y="388" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa3c2">rule that wins</text><text x="394" y="414" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="#f3f4fb">*</text><path d="M620 396 H664" stroke="#6b7396" stroke-width="3" fill="none"/><path d="M664 389 L676 396 L664 403Z" fill="#6b7396"/><rect x="684" y="360" width="236" height="72" rx="12" fill="#0a0c14" stroke="#e5e7eb" stroke-width="3"/><circle cx="720" cy="396" r="17" fill="#e5e7eb"/><circle cx="720" cy="396" r="9" fill="#0a0c14"/><circle cx="720" cy="396" r="4" fill="#e5e7eb"/><text x="750" y="390" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#f3f4fb">Safari</text><text x="750" y="412" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#e5e7eb">your everyday browser</text><text x="36" y="478" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7396">The second click is also under ~/work, but ~/work/clients/acme is the longer folder, so it wins.</text>
</svg>